version: "3.8"

services:
  app:
    build: .
    container_name: wildlife-camera-traps
    ports:
      - "8000:8000"
    volumes:
      - wildlife_data:/app/wildlife_data.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  wildlife_data:
