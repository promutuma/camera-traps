version: "3.8"

services:
  app:
    build: .
    container_name: wildlife-camera-traps
    ports:
      - "8000:8000"
    volumes:
      - wildlife_data:/app/data
      - /tmp/megadetector_models:/tmp/megadetector_models
      - ${HOME}/.EasyOCR:/root/.EasyOCR
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/wildlife_data.db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  wildlife_data:
